package:
  name: labeled-data
  build:
    censorProjectWarnings:
      - ImplicitQualifiedImport
  publish:
    version: 0.2.1
    license: MIT
    location:
      githubOwner: m-bock
      githubRepo: purescript-labeled-data
  dependencies:
    - either: ">=6.1.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.1 <7.0.0"
    - record: ">=4.0.0 <5.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - type-equality: ">=4.0.1 <5.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
    - variant: ">=8.0.0 <9.0.0"
  test:
    main: Test.Main
    censorTestWarnings:
      - ImplicitQualifiedImport
    dependencies:
      - aff: ">=7.1.0 <8.0.0"
      - effect: ">=4.0.0 <5.0.0"
      - spec: ">=7.3.0 <8.0.0"
workspace:
  buildOpts:
    censorLibraryWarnings: all
